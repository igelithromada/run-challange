<body><main><div style="font-size:3rem">📡</div><h1>Teď nejsi připojený k internetu</h1><p>Jakmile se připojení obnoví, můžeš stránku zkusit načíst znovu. Dříve načtené údaje mohou být dostupné v aplikaci.</p><button onclick="location.reload()">Zkusit znovu</button></main></body>
