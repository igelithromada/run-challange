name: Kontrola běžecké aplikace

on:
  push:
    branches:
      - main
      - fix-from-working-23e5eed
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Instalace a sestavení aplikace
    runs-on: ubuntu-latest
    steps:
      - name: Načtení zdrojového kódu
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalace a synchronizace závislostí
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Kontrola TypeScriptu
        run: npx tsc --noEmit

      - name: Kontrola ESLintu
        run: npm run lint

      - name: Regresní testy týmů a výzev
        run: npm test

      - name: Nastavení Javy pro Firestore emulátor
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test oprávnění a souběžných transakcí ve Firestore
        run: npm run test:emulator

      - name: Produkční sestavení
        run: npm run build
