name: Kontrola běžecké aplikace

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Instalace a sestavení aplikace
    runs-on: ubuntu-latest
    steps:
      - name: Načtení zdrojového kódu
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalace a synchronizace závislostí
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Kontrola TypeScriptu
        run: npx tsc --noEmit

      - name: Kontrola ESLintu
        run: npm run lint

      - name: Produkční sestavení
        run: npm run build